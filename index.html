<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Touch to Create</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Avenir Next Cyr';
    src: url('assets/AvenirNextCyr-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Avenir Next Cyr';
    src: url('assets/AvenirNextCyr-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: 'Avenir Next Cyr';
    src: url('assets/AvenirNextCyr-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Didot';
    src: url('assets/Didot.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Didot';
    src: url('assets/Didot-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Didot';
    src: url('assets/Didot-Italic.ttf') format('truetype');
    font-weight: 400;
    font-style: italic;
  }
</style>
<script src="https://unpkg.com/@rive-app/canvas@2.23.10"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #frame {
    width: 1080px;
    height: 1920px;
    transform-origin: center center;
    position: relative;
    overflow: hidden;
    background: #b8cfe0;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }

  /* ============ LOGO ============ */

  /* Old top-left logo hidden */
  .logo-top {
    display: none;
  }

  /* Logo and address next to circle (appear on active) */
  .circle-logo,
  .circle-address {
    position: absolute;
    top: 42%;
    left: 50%;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%);
    transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.6s ease-in-out;
  }

  .circle-logo img {
    width: 180px;
    height: auto;
    display: block;
  }

  .circle-address {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
  }

  #frame.active .circle-logo {
    opacity: 1;
    transform: translate(calc(-50% - 320px), -50%);
  }

  #frame.active .circle-address {
    opacity: 1;
    transform: translate(calc(-50% + 320px), -50%);
  }

  /* ============ SKY LAYERS ============ */

  .sky-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #7baed4 0%, #a0c8e0 15%, #c4dced 35%,
      #e2d6c8 55%, #e8c9a8 75%, #d4a878 100%
    );
    transition: opacity 2s ease-in-out;
    z-index: 0;
  }

  .sky-gradient-storm {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #1a2030 0%, #2a3348 15%, #3a4058 35%,
      #4a465a 55%, #5a4a48 75%, #3a2a20 100%
    );
    opacity: 0;
    transition: opacity 2s ease-in-out;
    z-index: 0;
  }

  .cloud-base {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    z-index: 1;
    opacity: 0.85;
    animation: drift-base 80s linear infinite;
    transition: filter 2s ease-in-out;
  }

  .cloud-base img {
    height: 100%;
    width: auto;
    display: block;
    flex-shrink: 0;
    margin-right: -700px;
  }

  @keyframes drift-base {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }

  .cloud {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    transition: filter 2s ease-in-out;
  }

  .cloud img {
    display: block;
    max-width: none;
    height: auto;
  }

  .cloud-1 { top: 3%; left: 0; opacity: 0.6; }
  .cloud-1 img { width: 1200px; animation: drift-cloud-1 30s linear infinite; animation-delay: -5s; }

  .cloud-2 { top: 32%; left: 0; opacity: 0.5; }
  .cloud-2 img { width: 1400px; animation: drift-cloud-2 70s linear infinite; animation-delay: -45s; }

  .cloud-3 { top: 58%; left: 0; opacity: 0.55; }
  .cloud-3 img { width: 1300px; animation: drift-cloud-3 50s linear infinite; animation-delay: -25s; }

  @keyframes drift-cloud-1 { 0% { transform: translateX(-1300px); } 100% { transform: translateX(1200px); } }
  @keyframes drift-cloud-2 { 0% { transform: translateX(-1500px); } 100% { transform: translateX(1200px); } }
  @keyframes drift-cloud-3 { 0% { transform: translateX(-1400px); } 100% { transform: translateX(1200px); } }

  #frame.active .sky-gradient { opacity: 0; }
  #frame.active .sky-gradient-storm { opacity: 1; }
  #frame.active .cloud-base,
  #frame.active .cloud { filter: brightness(0.35) contrast(1.5) saturate(0.5); }

  /* Storm clouds — slide in from sides on active */
  .storm-cloud {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    /* Stronger ease-out: sharp takeoff, long gentle deceleration */
    transition: transform 3s cubic-bezier(0.16, 1, 0.3, 1), opacity 2s ease-in-out, filter 2s ease-in-out;
    /* Dramatic storm look: darker, cooler, higher contrast, soft shadow */
    filter:
      brightness(0.45)
      contrast(1.7)
      saturate(0.7)
      hue-rotate(200deg)
      drop-shadow(0 25px 60px rgba(0, 0, 25, 0.8));
  }


  .storm-cloud img {
    display: block;
    max-width: none;
    height: auto;
  }

  /* Left side storm clouds — start off left edge */
  .storm-cloud-left-1 {
    top: -8%;
    left: 0;
    transform: translateX(-2000px);
    transition-duration: 2.8s, 2s, 2s; /* fastest */
  }
  .storm-cloud-left-1 img {
    width: 2300px;
    animation: storm-drift-right-1 22s ease-in-out infinite alternate;
  }

  .storm-cloud-left-2 {
    top: 38%;
    left: 0;
    transform: translateX(-2200px);
    transition-duration: 3.8s, 2s, 2s; /* slowest */
  }
  .storm-cloud-left-2 img {
    width: 2500px;
    animation: storm-drift-right-2 35s ease-in-out infinite alternate;
  }

  /* Right side storm clouds — start off right edge */
  .storm-cloud-right-1 {
    top: 12%;
    right: 0;
    transform: translateX(2000px);
    transition-duration: 3.2s, 2s, 2s;
  }
  .storm-cloud-right-1 img {
    width: 2400px;
    animation: storm-drift-left-1 27s ease-in-out infinite alternate;
  }

  .storm-cloud-right-2 {
    top: 62%;
    right: 0;
    transform: translateX(2100px);
    transition-duration: 3.5s, 2s, 2s;
  }
  .storm-cloud-right-2 img {
    width: 2200px;
    animation: storm-drift-left-2 40s ease-in-out infinite alternate;
  }

  @keyframes storm-drift-right-1 {
    0% { transform: translateX(0); }
    100% { transform: translateX(220px); }
  }
  @keyframes storm-drift-right-2 {
    0% { transform: translateX(0); }
    100% { transform: translateX(300px); }
  }
  @keyframes storm-drift-left-1 {
    0% { transform: translateX(0); }
    100% { transform: translateX(-260px); }
  }
  @keyframes storm-drift-left-2 {
    0% { transform: translateX(0); }
    100% { transform: translateX(-340px); }
  }

  /* On active — slide toward center and fade in */
  #frame.active .storm-cloud {
    opacity: 0.95;
  }
  #frame.active .storm-cloud-left-1 { transform: translateX(-200px); }
  #frame.active .storm-cloud-left-2 { transform: translateX(-150px); }
  #frame.active .storm-cloud-right-1 { transform: translateX(200px); }
  #frame.active .storm-cloud-right-2 { transform: translateX(180px); }

  /* ============ HAND ============ */

  #hand-canvas {
    position: absolute;
    top: -235px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 1500px;
    z-index: 11;
    pointer-events: none;
    transition: filter 2s ease-in-out;
  }

  #frame.active #hand-canvas {
    animation: tremble 0.12s ease-in-out infinite alternate;
  }

  @keyframes tremble {
    from { transform: translateX(-50%) translate(0, 0); }
    to { transform: translateX(-50%) translate(1px, 1.5px); }
  }

  /* ============ CIRCLE ============ */

  .circle-area {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .circle-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.7);
    background: transparent;
    cursor: pointer;
    position: relative;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-btn.active {
    border-color: transparent;
    box-shadow: none;
  }

  /* Tap hand icon inside button */
  .tap-icon {
    width: 96px;
    height: 96px;
    opacity: 0.7;
    animation: tap-motion 2s ease-in-out infinite;
  }

  .circle-btn.active .tap-icon {
    display: none;
  }

  @keyframes tap-motion {
    0% { transform: translate(85px, 85px) scale(1); opacity: 0; }
    30% { transform: translate(35px, 35px) scale(0.97); opacity: 0.7; }
    45% { transform: translate(28px, 28px) scale(0.9); opacity: 1; }
    55% { transform: translate(28px, 28px) scale(0.9); opacity: 1; }
    70% { transform: translate(35px, 35px) scale(0.97); opacity: 0.7; }
    100% { transform: translate(85px, 85px) scale(1); opacity: 0; }
  }

  /* Tap rays — appear at moment of "press" */
  .tap-rays {
    position: absolute;
    width: 60px;
    height: 60px;
    pointer-events: none;
    animation: rays-burst 2s ease-in-out infinite;
  }

  .tap-rays line {
    stroke: rgba(255, 255, 255, 0.6);
    stroke-width: 1.5;
    stroke-linecap: round;
  }

  @keyframes rays-burst {
    0% { opacity: 0; transform: scale(0.5); }
    40% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1); }
    65% { opacity: 0; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  .circle-btn.active .tap-rays {
    display: none;
  }

  /* Pulse rings */
  .circle-btn::before,
  .circle-btn::after {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: pulse 2.5s ease-out infinite;
  }
  .circle-btn::after { animation-delay: 1.25s; }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }

  .circle-btn.active::before,
  .circle-btn.active::after {
    animation: none;
    opacity: 0;
  }

  /* Touch text */
  .touch-text {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 38px;
    white-space: nowrap;
    transition: opacity 0.5s ease-in-out;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 5px;
    user-select: none;
    -webkit-user-select: none;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
    text-transform: uppercase;
  }

  /* ============ LANGUAGE SWITCHER ============ */

  .lang-btn {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    transition: opacity 0.5s ease-in-out;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.6);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.3s;
    margin-top: 5px;
  }

  .lang-btn:hover {
    border-color: rgba(255, 255, 255, 0.7);
    color: rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.15);
  }

  /* ============ BOTTOM SECTION ============ */

  .bottom-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 900px;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    z-index: 4;
    pointer-events: none;
  }

  .bottom-section {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 0 65px 50px;
    user-select: none;
    -webkit-user-select: none;
  }

  .title-main {
    font-family: 'Didot', 'Georgia', serif;
    font-size: 143px;
    font-weight: 700;
    color: #fff;
    line-height: 1.0;
    margin-bottom: 5px;
    letter-spacing: -2.9px;
    text-align: center;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.3s, text-shadow 0.3s;
  }

  .title-sub {
    font-family: 'Didot', 'Georgia', serif;
    font-size: 86px;
    font-weight: 400;
    font-style: normal;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.2;
    margin-bottom: 350px;
    text-align: center;
    letter-spacing: 2px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.3s, text-shadow 0.3s;
  }

  .title-main.scrambling,
  .title-sub.scrambling {
    filter: blur(8px);
    text-shadow: 0 0 30px rgba(150, 180, 255, 0.6), 0 0 60px rgba(120, 150, 255, 0.4);
  }

  .title-main,
  .title-sub {
    transition: filter 0.5s ease-in-out, text-shadow 0.5s ease-in-out;
  }

  /* Active-state intro (two lines, shown only when pressed) */
  .active-intro {
    display: none;
    text-align: center;
    margin-bottom: 40px;
  }
  #frame.active .active-intro {
    display: block;
  }

  .intro-line {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-weight: 500;
    font-size: 82px;
    color: #fff;
    text-transform: uppercase;
    line-height: 1.0;
    letter-spacing: 1px;
    transition: filter 0.5s ease-in-out, text-shadow 0.5s ease-in-out;
  }
  .intro-line + .intro-line { margin-top: 4px; }

  /* Second line of the big active title (EXHIBITION / IZSTĀDE) */
  .title-main-line2 {
    display: none;
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-weight: 700;
    color: #fff;
    line-height: 1.0;
    text-align: center;
    letter-spacing: -1px;
    height: 150px;
    align-items: center;
    justify-content: center;
    transition: filter 0.5s ease-in-out, text-shadow 0.5s ease-in-out;
  }
  #frame.active .title-main-line2 {
    display: flex;
    font-size: 150px;
  }

  /* Active-state overrides for title-main (first huge line: IMMERSIVE / IMERSĪVA) */
  #frame.active .title-main {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-weight: 700;
    font-size: 150px;
    letter-spacing: -1px;
    text-transform: uppercase;
  }

  /* Active-state overrides for title-sub (Michelangelo — El tocco dell'Eterno) */
  #frame.active .title-sub {
    font-family: 'Didot', 'Georgia', serif;
    font-weight: 400;
    font-size: 50px;
    letter-spacing: 1px;
    margin-bottom: 80px;
    text-transform: none;
  }

  .intro-line.scrambling,
  .title-main-line2.scrambling {
    filter: blur(8px);
    text-shadow: 0 0 30px rgba(150, 180, 255, 0.6), 0 0 60px rgba(120, 150, 255, 0.4);
  }

  /* Glitch effect */
  @keyframes glitch-1 {
    0% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 2px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translate(3px, -1px); }
    40% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 1px); }
    60% { clip-path: inset(10% 0 70% 0); transform: translate(4px, -2px); }
    80% { clip-path: inset(70% 0 5% 0); transform: translate(-1px, 3px); }
    100% { clip-path: inset(30% 0 40% 0); transform: translate(2px, -1px); }
  }

  @keyframes glitch-2 {
    0% { clip-path: inset(50% 0 20% 0); transform: translate(3px, -2px); opacity: 0.8; }
    25% { clip-path: inset(10% 0 60% 0); transform: translate(-4px, 1px); opacity: 0.6; }
    50% { clip-path: inset(70% 0 5% 0); transform: translate(2px, 3px); opacity: 0.9; }
    75% { clip-path: inset(25% 0 45% 0); transform: translate(-3px, -1px); opacity: 0.7; }
    100% { clip-path: inset(55% 0 15% 0); transform: translate(1px, 2px); opacity: 0.8; }
  }

  .title-glitch {
    position: relative;
  }

  .title-glitch.glitching::before,
  .title-glitch.glitching::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    text-align: inherit;
    letter-spacing: inherit;
    font: inherit;
    color: inherit;
  }

  .title-glitch.glitching::before {
    color: rgba(255, 100, 100, 0.8);
    animation: glitch-1 0.15s linear infinite;
  }

  .title-glitch.glitching::after {
    color: rgba(100, 200, 255, 0.8);
    animation: glitch-2 0.12s linear infinite;
  }

  .scramble-char {
    opacity: 0.5;
    color: rgba(200, 210, 255, 0.7);
  }

  .qr-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .qr-label {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    letter-spacing: 10px;
    text-indent: 10px;
  }

  .qr-code {
    width: 130px;
    height: 130px;
  }

  /* ============ INFO BUTTON ============ */

  .info-btn {
    position: absolute;
    bottom: 254px; /* 50 (padding) + 130 (qr) + 10 (gap) + 24 (label) + 40 (spacing) */
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.7);
    font-family: 'Didot', 'Georgia', serif;
    font-size: 28px;
    font-style: italic;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .info-btn:hover {
    border-color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  /* ============ INFO PANEL ============ */

  .info-panel {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    padding: 140px 80px 80px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in-out;
    overflow: hidden;
  }

  .info-bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(15px) brightness(0.4);
    z-index: -1;
    transform: scale(1.1);
  }

  .info-panel.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .info-panel-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
  }

  .info-title {
    font-family: 'Didot', 'Georgia', serif;
    font-size: 72px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }

  .info-text {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 30px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
  }

  .info-text strong {
    color: #fff;
    font-weight: 500;
  }

  .info-text .highlight {
    font-size: 34px;
    color: #fff;
    font-weight: 400;
    letter-spacing: 1px;
  }

  .info-details {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 26px;
    color: rgba(255, 255, 255, 0.6);
    line-height: 1.8;
  }

  .info-hashtags {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.35);
    line-height: 1.6;
    margin-top: 10px;
  }

  .info-close {
    position: absolute;
    top: 40px;
    right: 65px;
    width: 50px;

<script>
(function () {
  const DESIGN_W = 1080;
  const DESIGN_H = 1920;
  const frame = document.getElementById('frame');

  // --- Scale frame to fit viewport ---
  function fitFrame() {
    const isMobile = window.innerWidth < 800;
    if (isMobile) {
      const s = window.innerHeight / DESIGN_H;
      frame.style.transform = `translate(-50%, -50%) scale(${s})`;
      frame.style.position = 'absolute';
      frame.style.top = '50%';
      frame.style.left = '50%';
      frame.style.boxShadow = 'none';
    } else {
      const pad = 40;
      const sx = (window.innerWidth - pad) / DESIGN_W;
      const sy = (window.innerHeight - pad) / DESIGN_H;
      frame.style.transform = `scale(${Math.min(sx, sy, 1)})`;
      frame.style.boxShadow = '0 0 60px rgba(0,0,0,0.5)';
    }
  }
  fitFrame();
  window.addEventListener('resize', fitFrame);

  // --- Language switcher ---
  const langBtn = document.getElementById('langBtn');
  const touchText = document.getElementById('touchText');
  const ticketsLabel = document.getElementById('ticketsLabel');
  let lang = 'en';

  langBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); });
  langBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); });
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const fxTouch = new TextScramble(touchText);
    const fxTickets = new TextScramble(ticketsLabel);
    if (lang === 'en') {
      lang = 'lv';
      langBtn.textContent = 'EN';
      fxTouch.setText('Pieskaries, lai izveidotu');
      fxTickets.setText('Biļetes');
    } else {
      lang = 'en';
      langBtn.textContent = 'LV';
      fxTouch.setText('Touch to Create');
      fxTickets.setText('Tickets');
    }
  });

  // --- Info panel ---
  const infoBtn = document.getElementById('infoBtn');
  const infoPanel = document.getElementById('infoPanel');
  const infoClose = document.getElementById('infoClose');
  const infoPanelContent = document.getElementById('infoPanelContent');

  const infoTexts = {
    en: `
      <div class="info-title">Michelangelo</div>
      <p class="info-text">A new large-scale 360° immersive exhibition at Digital Art House.</p>
      <p class="info-text">Discover the genius of the High Renaissance — <strong>Michelangelo Buonarroti</strong>.</p>
      <p class="info-text">Begin with a short introductory film.<br>Then — 50 minutes of full immersion.</p>
      <p class="info-text highlight">Light. Scale. Movement. Sound.</p>
      <p class="info-text">This is not a museum visit.<br>It is a true touch of Eternity.</p>
      <p class="info-details">📍 Digital Art House, Skolas 2<br>🎟 Tickets: digitalarthouse.eu</p>
      <p class="info-hashtags">#DigitalArtHouse #Michelangelo #ImmersiveArt #RigaEvents #ArtExperience</p>
    `,
    lv: `
      <div class="info-title">Michelangelo</div>
      <p class="info-text">Jauna, vērienīga 360° imersīvā izstāde „Digital Art House".</p>
      <p class="info-text">Atklājiet augstās renesanses ģēniju — <strong>Mičelanjelo Buonarroti</strong>.</p>
      <p class="info-text">Sāciet ar īsu ievada filmu.<br>Pēc tam — 50 minūtes pilnīgas imersijas.</p>
      <p class="info-text highlight">Gaisma. Mērogs. Kustība. Skaņa.</p>
      <p class="info-text">Šī nav parasta muzeja apmeklējuma pieredze.<br>Tā ir patiesa saskare ar mūžību.</p>
      <p class="info-details">📍 Digital Art House, Skolas 2<br>🎟 Biļetes: digitalarthouse.eu</p>
      <p class="info-hashtags">#DigitalArtHouse #Michelangelo #ImmersiveArt #RigaEvents #ArtExperience</p>
    `
  };

  const infoBgVideo = document.getElementById('infoBgVideo');

  function openInfo() {
    infoPanelContent.innerHTML = infoTexts[lang];
    frame.classList.add('info-open');
    infoPanel.classList.add('visible');
    infoBgVideo.currentTime = 0;
    infoBgVideo.play();
  }

  function closeInfo() {
    infoPanel.classList.remove('visible');
    infoBgVideo.pause();
    setTimeout(() => frame.classList.remove('info-open'), 300);
  }

  infoBtn.addEventListener('click', (e) => { e.stopPropagation(); openInfo(); });
  infoBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); });
  infoBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); });
  infoClose.addEventListener('click', closeInfo);
  infoPanel.addEventListener('click', closeInfo);

  // --- Rive setup ---
  const handCanvas = document.getElementById('hand-canvas');
  let riveInstance = null;
  let isPressedInput = null;

  const r = new rive.Rive({
    src: 'assets/hand.riv',
    canvas: handCanvas,
    autoplay: true,
    stateMachines: 'State Machine 1',
    fit: rive.Fit.Contain,
    alignment: rive.Alignment.Center,
    onLoad: () => {
      riveInstance = r;
      const inputs = r.stateMachineInputs('State Machine 1');
      if (inputs) {
        isPressedInput = inputs.find(i => i.name === 'isPressed');
        console.log('Rive loaded. Inputs:', inputs.map(i => i.name));
      }
      r.resizeDrawingSurfaceToCanvas();
    },
    onLoadError: (e) => {
      console.error('Rive load error:', e);
    }
  });

  // --- Circle interaction ---
  const btn = document.getElementById('circleBtn');

  const titleMain = document.getElementById('titleMain');
  const titleSub = document.getElementById('titleSub');
  const titleMainLine2 = document.getElementById('titleMainLine2');
  const introLine1 = document.getElementById('introLine1');
  const introLine2 = document.getElementById('introLine2');

  // --- Text Scramble (airport flip board effect) ---
  class TextScramble {
    constructor(el) {
      this.el = el;
      this.chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      this.update = this.update.bind(this);
    }
    setText(newText) {
      const oldText = this.el.innerText;
      const length = Math.max(oldText.length, newText.length);
      const promise = new Promise((resolve) => (this.resolve = resolve));
      this.queue = [];
      for (let i = 0; i < length; i++) {
        const from = oldText[i] || '';
        const to = newText[i] || '';
        const start = Math.floor(Math.random() * 20);
        const end = start + Math.floor(Math.random() * 25);
        this.queue.push({ from, to, start, end });
      }
      cancelAnimationFrame(this.frameRequest);
      this.frame = 0;
      this.update();
      return promise;
    }
    update() {
      let output = '';
      let complete = 0;
      for (let i = 0, n = this.queue.length; i < n; i++) {
        let { from, to, start, end, char } = this.queue[i];
        if (this.frame >= end) {
          complete++;
          output += to;
        } else if (this.frame >= start) {
          if (!char || Math.random() < 0.28) {
            char = this.chars[Math.floor(Math.random() * this.chars.length)];
            this.queue[i].char = char;
          }
          output += `<span class="scramble-char">${char}</span>`;
        } else {
          output += from;
        }
      }
      this.el.innerHTML = output;
      if (complete === this.queue.length) {
        this.resolve();
        return;
      }
      this.frameRequest = requestAnimationFrame(this.update);
      this.frame++;
    }
  }

  const fxMain = new TextScramble(titleMain);
  const fxSub = new TextScramble(titleSub);
  const fxMainLine2 = new TextScramble(titleMainLine2);
  const fxIntro1 = new TextScramble(introLine1);
  const fxIntro2 = new TextScramble(introLine2);

  // --- Flash overlay (full-screen for initial burst) ---
  // mix-blend-mode: screen — the white layer additively brightens whatever is underneath
  // (sky/clouds/particles) instead of sitting on top as a flat white wash.
  const flashOverlay = document.createElement('div');
  flashOverlay.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none;transition:opacity 0.08s;mix-blend-mode:screen;';
  frame.appendChild(flashOverlay);

  // --- Sky flash overlay (localized radial gradients at random positions) ---
  // screen blend + heavy blur + low opacity = the gradient circle dissolves into a soft
  // brightness bloom that feels like light spreading inside the clouds.
  const skyFlashOverlay = document.createElement('div');
  skyFlashOverlay.style.cssText = 'position:absolute;inset:-120px;opacity:0;z-index:6;pointer-events:none;transition:opacity 0.06s;mix-blend-mode:screen;filter:blur(55px);';
  frame.appendChild(skyFlashOverlay);

  // Random positions across the whole screen
  const skyFlashPositions = [
    // Upper area
    { x: '15%', y: '8%'  },
    { x: '85%', y: '10%' },
    { x: '50%', y: '5%'  },
    { x: '35%', y: '18%' },
    { x: '70%', y: '20%' },
    // Middle area
    { x: '10%', y: '40%' },
    { x: '90%', y: '38%' },
    { x: '25%', y: '50%' },
    { x: '75%', y: '48%' },
    { x: '50%', y: '42%' },
    // Lower area
    { x: '15%', y: '72%' },
    { x: '85%', y: '70%' },
    { x: '45%', y: '85%' },
    { x: '60%', y: '80%' },
    { x: '25%', y: '90%' },
  ];

  // Generation counter — lets us cancel timeouts from older flashes when a new one kicks in
  let flashGen = 0;

  function randomSkyFlash() {
    const pos = skyFlashPositions[Math.floor(Math.random() * skyFlashPositions.length)];
    // Bias toward small: most flashes stay around the base size, occasional huge ones
    // pow(rand, 1.8) concentrates values near 0 → most multipliers are small, rare ones approach max
    const sizeMul = 1 + Math.pow(Math.random(), 1.8) * 2.2; // ≈ 1.0 … 3.2
    const radius = 350 * sizeMul;
    // Larger flashes read as brighter so we taper intensity a bit for the huge ones
    const baseIntensity = 0.14 + Math.random() * 0.16;
    const intensity = baseIntensity * (0.7 + 0.3 / sizeMul); // smaller = fuller brightness
    const myGen = ++flashGen;

    skyFlashOverlay.style.background =
      `radial-gradient(circle ${radius}px at ${pos.x} ${pos.y}, rgba(230,240,255,${intensity}) 0%, rgba(200,220,255,${intensity * 0.55}) 35%, rgba(170,200,255,${intensity * 0.2}) 60%, rgba(150,190,255,0) 85%)`;

    // Strobe: rapid flicker in the first ~130ms — matches how real lightning fires
    // multiple return strokes in quick succession before fading out.
    const strobe = [
      { t: 0,   op: '1' },
      { t: 22,  op: '0.18' },
      { t: 42,  op: '1' },
      { t: 65,  op: '0.25' },
      { t: 88,  op: '0.95' },
      { t: 112, op: '0.4' },
      { t: 132, op: '0.85' },
    ];

    strobe.forEach(({ t, op }) => {
      setTimeout(() => {
        if (myGen !== flashGen) return;
        skyFlashOverlay.style.transition = 'none';
        skyFlashOverlay.style.opacity = op;
      }, t);
    });

    // Smooth fade to 0 after the strobe
    setTimeout(() => {
      if (myGen !== flashGen) return;
      skyFlashOverlay.style.transition = 'opacity 0.25s ease-out';
      skyFlashOverlay.style.opacity = '0';
    }, 160 + Math.random() * 50);
  }

  let flashInterval = null;

  function triggerFlashes() {
    // Initial press burst — full-screen white, keeps its punch
    const delays = [50, 200, 400, 1400, 1550, 1750];
    delays.forEach(d => {
      setTimeout(() => {
        flashOverlay.style.opacity = '0.7';
        setTimeout(() => { flashOverlay.style.opacity = '0'; }, 50);
      }, d);
    });

    scheduleNextFlashEvent();
  }

  // Recursive scheduler — produces truly random gaps + random event sizes,
  // alternating between quiet periods and storm bursts like real weather.
  function scheduleNextFlashEvent() {
    if (!isActive) return;

    // Pick a "mood" for the next gap
    const mood = Math.random();
    let delay;
    if (mood < 0.35) {
      // Long quiet: 5–12 s — the sky goes still
      delay = 5000 + Math.random() * 7000;
    } else if (mood < 0.85) {
      // Normal gap: 1.2–4 s
      delay = 1200 + Math.random() * 2800;
    } else {
      // Close follow-up: 0.3–1.2 s — chained events
      delay = 300 + Math.random() * 900;
    }

    flashInterval = setTimeout(() => {
      if (!isActive) return;

      // Pick an event type
      const roll = Math.random();
      if (roll < 0.55) {
        // 55% — single flash
        randomSkyFlash();
      } else if (roll < 0.86) {
        // 31% — short chain 2–4 flashes
        const n = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) {
          setTimeout(randomSkyFlash, i * (70 + Math.random() * 200));
        }
      } else {
        // 14% — big burst 5–10 flashes across the sky
        const n = 5 + Math.floor(Math.random() * 6);
        for (let i = 0; i < n; i++) {
          setTimeout(randomSkyFlash, i * (60 + Math.random() * 160));
        }
      }

      scheduleNextFlashEvent();
    }, delay);
  }

  function stopFlashes() {
    if (flashInterval) { clearTimeout(flashInterval); flashInterval = null; }
  }

  function activate() {
    wasActive = true;
    btn.classList.add('active');
    frame.classList.add('active');
    isActive = true;
    if (isPressedInput) isPressedInput.value = true;
    const intro1Text = lang === 'lv' ? 'IENĀC' : 'ENTER THE';
    const intro2Text = lang === 'lv' ? '360° PIEREDZĒ' : '360° EXPERIENCE';
    const mainText  = lang === 'lv' ? 'IMERSĪVA' : 'IMMERSIVE';
    const main2Text = lang === 'lv' ? 'IZSTĀDE'  : 'EXHIBITION';
    const subText   = "Michelangelo — El tocco dell'Eterno";

    introLine1.classList.add('scrambling');
    introLine2.classList.add('scrambling');
    titleMain.classList.add('scrambling');
    titleMainLine2.classList.add('scrambling');
    titleSub.classList.add('scrambling');
    fxIntro1.setText(intro1Text).then(() => introLine1.classList.remove('scrambling'));
    fxIntro2.setText(intro2Text).then(() => introLine2.classList.remove('scrambling'));
    fxMain.setText(mainText).then(() => titleMain.classList.remove('scrambling'));
    fxMainLine2.setText(main2Text).then(() => titleMainLine2.classList.remove('scrambling'));
    fxSub.setText(subText).then(() => titleSub.classList.remove('scrambling'));
    triggerFlashes();
  }

  let wasActive = false;

  function deactivate() {
    if (!wasActive) return;
    wasActive = false;
    btn.classList.remove('active');
    frame.classList.remove('active');
    isActive = false;
    stopFlashes();
    if (isPressedInput) isPressedInput.value = false;
    introLine1.classList.add('scrambling');
    introLine2.classList.add('scrambling');
    titleMain.classList.add('scrambling');
    titleMainLine2.classList.add('scrambling');
    titleSub.classList.add('scrambling');
    fxIntro1.setText('').then(() => introLine1.classList.remove('scrambling'));
    fxIntro2.setText('').then(() => introLine2.classList.remove('scrambling'));
    fxMain.setText('Michelangelo').then(() => titleMain.classList.remove('scrambling'));
    fxMainLine2.setText('').then(() => titleMainLine2.classList.remove('scrambling'));
    fxSub.setText("— El tocco dell'Eterno").then(() => titleSub.classList.remove('scrambling'));
  }

  btn.addEventListener('mousedown', activate);
  window.addEventListener('mouseup', deactivate);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); activate(); });
  window.addEventListener('touchend', deactivate);

  // --- Particles ---
  const particleCanvas = document.getElementById('particle-canvas');
  const pCtx = particleCanvas.getContext('2d');
  const particles = [];
  const PARTICLE_COUNT = 60;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * 1080, y: Math.random() * 1920,
      size: Math.random() * 2 + 0.5,
      speedX: Math.random() * 0.8 + 0.2,
      speedY: (Math.random() - 0.5) * 0.3,
      opacity: Math.random() * 0.4 + 0.1,
      wobbleSpeed: Math.random() * 2 + 1,
      wobbleAmp: Math.random() * 0.5 + 0.2,
    });
  }

  function drawParticles() {
    requestAnimationFrame(drawParticles);
    pCtx.clearRect(0, 0, 1080, 1920);
    for (const p of particles) {
      p.x += p.speedX;
      p.y += p.speedY + Math.sin(p.x * 0.01 * p.wobbleSpeed) * p.wobbleAmp;
      if (p.x > 1100) { p.x = -20; p.y = Math.random() * 1920; }
      if (p.y < -20) p.y = 1940;
      if (p.y > 1940) p.y = -20;
      pCtx.globalAlpha = p.opacity;
      pCtx.fillStyle = 'rgba(255, 255, 255, 1)';
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      pCtx.fill();
    }
    pCtx.globalAlpha = 1;
  }
  drawParticles();

  // --- Premium lightning storm — thin, fast, layered with afterglow + mega strikes ---
  const beamCanvas = document.getElementById('beam-canvas');
  const ctx = beamCanvas.getContext('2d');
  let isActive = false;
  let beamProgress = 0;
  let time = 0;

  const centerX = 540;
  const centerY = 806;

  const bolts = [];
  const afterglows = [];
  const endpointFlashes = [];
  let nextBoltTime = 0;
  let nextMegaTime = 1.2;

  // Circle ring radius — bolts dance AROUND this radius
  const RING_RADIUS = 62;

  // Build a jagged arc along the ring: travels from startAngle to startAngle+arcExtent,
  // with radial (in/out) jitter rather than linear perpendicular jitter
  function buildJaggedArc(startAngle, arcExtent, baseRadius, segCount, radialJitter) {
    const pts = [];
    for (let s = 0; s <= segCount; s++) {
      const frac = s / segCount;
      const envelope = Math.sin(frac * Math.PI);
      const jitter = (Math.random() - 0.5) * radialJitter * envelope;
      const theta = startAngle + arcExtent * frac;
      const r = baseRadius + jitter;
      pts.push({
        x: Math.cos(theta) * r,
        y: Math.sin(theta) * r,
      });
    }
    return pts;
  }

  // Recursive branching — branches are SHORTER arcs possibly curving off in a different direction
  function buildArcBolt(startAngle, arcExtent, baseRadius, depth) {
    const segCount = 10 + Math.floor(Math.random() * 5);
    const segs = buildJaggedArc(startAngle, arcExtent, baseRadius, segCount, 22);

    const subs = [];
    if (depth < 2) {
      const count = depth === 0
        ? (Math.random() < 0.8 ? 2 : (Math.random() < 0.5 ? 3 : 1))
        : (Math.random() < 0.55 ? 1 : 0);
      for (let i = 0; i < count; i++) {
        // Fork at a random point along the parent arc
        const forkFrac = 0.25 + Math.random() * 0.5;
        const forkAngle = startAngle + arcExtent * forkFrac;
        // Sub-arc travels in a new direction — possibly reverses, possibly curves outward
        const subExtent = arcExtent * (0.3 + Math.random() * 0.45) * (Math.random() < 0.4 ? -1 : 1);
        // Sub-arc may sit at a slightly different radius
        const subRadius = baseRadius + (Math.random() - 0.5) * 24;
        subs.push(buildArcBolt(forkAngle, subExtent, subRadius, depth + 1));
      }
    }
    return { segs, subs };
  }

  function spawnBolt(isMega = false) {
    const startAngle = Math.random() * Math.PI * 2;
    const arcExtent = isMega
      ? (Math.PI * (0.65 + Math.random() * 0.5)) * (Math.random() < 0.5 ? 1 : -1)   // ~120°–180°
      : (Math.PI * (0.22 + Math.random() * 0.45)) * (Math.random() < 0.5 ? 1 : -1); // ~40°–120°
    // Most bolts sit just outside the ring; some dip inside
    const baseRadius = RING_RADIUS + (Math.random() - 0.3) * 22;
    const bolt = buildArcBolt(startAngle, arcExtent, baseRadius, 0);
    bolts.push({
      bolt,
      age: 0,
      maxAge: isMega ? 1.2 + Math.random() * 0.6 : 0.7 + Math.random() * 0.3,
      width: isMega ? 1.4 : 0.9 + Math.random() * 0.4,
      isMega,
      flashed: false,
    });
    if (isMega && typeof randomSkyFlash === 'function') {
      randomSkyFlash();
    }
  }

  // Draw a portion of a polyline between tailFrac and headFrac (both 0..1 of path length)
  function drawPolylinePortion(pts, tailFrac, headFrac, cx, cy, microJitter) {
    if (tailFrac >= headFrac || pts.length < 2) return;
    const n = pts.length - 1; // number of segments
    const tailGlobal = Math.max(0, Math.min(n, tailFrac * n));
    const headGlobal = Math.max(0, Math.min(n, headFrac * n));
    const jamp = microJitter ? 1.0 : 0;

    ctx.beginPath();
    let started = false;

    for (let i = 0; i < n; i++) {
      const segStart = i;
      const segEnd = i + 1;
      if (segEnd <= tailGlobal) continue;
      if (segStart >= headGlobal) break;

      const clipStart = Math.max(segStart, tailGlobal);
      const clipEnd = Math.min(segEnd, headGlobal);
      const tStart = clipStart - segStart;
      const tEnd = clipEnd - segStart;

      const dx = pts[i + 1].x - pts[i].x;
      const dy = pts[i + 1].y - pts[i].y;
      const x0 = pts[i].x + dx * tStart;
      const y0 = pts[i].y + dy * tStart;
      const x1 = pts[i].x + dx * tEnd;
      const y1 = pts[i].y + dy * tEnd;

      if (!started) {
        ctx.moveTo(cx + x0 + (Math.random() - 0.5) * jamp, cy + y0 + (Math.random() - 0.5) * jamp);
        started = true;
      }
      ctx.lineTo(cx + x1 + (Math.random() - 0.5) * jamp, cy + y1 + (Math.random() - 0.5) * jamp);
    }
    ctx.stroke();
  }

  function walkBolt(bolt, fn, depth = 0) {
    fn(bolt.segs, depth);
    for (const sub of bolt.subs) walkBolt(sub, fn, depth + 1);
  }

  function strokeBoltThin(bolt, width, alpha, tailFrac, headFrac) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Pass 1: wide electric-blue halo
    ctx.strokeStyle = `rgba(60, 150, 255, ${alpha * 0.5})`;
    ctx.shadowColor = 'rgba(100, 180, 255, 0.95)';
    ctx.shadowBlur = 14;
    walkBolt(bolt, (segs, d) => {
      ctx.lineWidth = width * (d === 0 ? 5 : d === 1 ? 3 : 2);
      drawPolylinePortion(segs, tailFrac, headFrac, centerX, centerY, true);
    });

    // Pass 2: light electric mid
    ctx.strokeStyle = `rgba(150, 210, 255, ${alpha * 0.85})`;
    ctx.shadowColor = 'rgba(120, 190, 255, 0.9)';
    ctx.shadowBlur = 7;
    walkBolt(bolt, (segs, d) => {
      ctx.lineWidth = width * (d === 0 ? 2 : d === 1 ? 1.2 : 0.9);
      drawPolylinePortion(segs, tailFrac, headFrac, centerX, centerY, true);
    });

    // Pass 3: hot white-blue core
    ctx.strokeStyle = `rgba(240, 250, 255, ${alpha})`;
    ctx.shadowBlur = 0;
    walkBolt(bolt, (segs, d) => {
      ctx.lineWidth = width * (d === 0 ? 0.9 : d === 1 ? 0.7 : 0.5);
      drawPolylinePortion(segs, tailFrac, headFrac, centerX, centerY, true);
    });
  }

  function strokeAfterglow(bolt, alpha) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = `rgba(80, 160, 255, ${alpha * 0.7})`;
    ctx.shadowColor = 'rgba(100, 180, 255, 0.8)';
    ctx.shadowBlur = 10;
    walkBolt(bolt, (segs, d) => {
      ctx.lineWidth = (d === 0 ? 2 : 1.4);
      drawPolylinePortion(segs, 0, 1, centerX, centerY, false);
    });
  }

  function drawPlasma() {
    requestAnimationFrame(drawPlasma);
    time += 0.032;

    const target = isActive ? 1 : 0;
    beamProgress += (target - beamProgress) * (isActive ? 5 : 3) * 0.016;
    if (Math.abs(beamProgress - target) < 0.001) beamProgress = target;

    ctx.clearRect(0, 0, 1080, 1920);
    if (beamProgress < 0.02) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // === CONSTANT CORE GLOW (electric blue) ===
    const breath = 0.92 + Math.sin(time * 2.5) * 0.08;
    const coreSize = 105 * beamProgress * breath;
    const core = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreSize);
    core.addColorStop(0, `rgba(235, 250, 255, ${0.98 * beamProgress})`);
    core.addColorStop(0.1, `rgba(170, 220, 255, ${0.78 * beamProgress})`);
    core.addColorStop(0.28, `rgba(90, 175, 255, ${0.45 * beamProgress})`);
    core.addColorStop(0.55, `rgba(50, 135, 255, ${0.18 * beamProgress})`);
    core.addColorStop(0.8, `rgba(35, 110, 240, 0.07)`);
    core.addColorStop(1, 'rgba(25, 95, 230, 0)');
    ctx.fillStyle = core;
    ctx.fillRect(centerX - coreSize, centerY - coreSize, coreSize * 2, coreSize * 2);

    // === SPAWN BOLTS — slower, smoother ===
    if (isActive) {
      if (time >= nextBoltTime) {
        spawnBolt(false);
        nextBoltTime = time + 0.35 + Math.random() * 0.45; // every 350–800ms
      }
      if (time >= nextMegaTime) {
        spawnBolt(true);
        nextMegaTime = time + 2.5 + Math.random() * 2.5;
      }
    }

    // === UPDATE & DRAW BOLTS (traveling dash animation) ===
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.age += 0.032;
      if (b.age >= b.maxAge) {
        // Queue a faint afterglow of the full path
        afterglows.push({
          bolt: b.bolt,
          age: 0,
          life: 0.22,
          initialAlpha: b.isMega ? 0.45 : 0.28,
        });
        bolts.splice(i, 1);
        continue;
      }
      const lifeFrac = b.age / b.maxAge;

      // Head progresses 0→1 over first 70% of life, tail follows delayed by 30%
      // Result: a dash travels along the path from start to end
      const head = Math.min(lifeFrac / 0.7, 1);
      const tail = Math.max(0, (lifeFrac - 0.3) / 0.7);

      // Trigger endpoint flash when head arrives at the destination
      if (!b.flashed && head >= 1) {
        b.flashed = true;
        const endpoint = b.bolt.segs[b.bolt.segs.length - 1];
        endpointFlashes.push({
          x: endpoint.x,
          y: endpoint.y,
          age: 0,
          life: 0.22,
          size: b.isMega ? 18 : 11,
        });
      }

      // Alpha stays mostly full, only drops near the very end
      let alpha = lifeFrac < 0.85 ? 1 : 1 - (lifeFrac - 0.85) / 0.15;
      // Light flicker for electric feel
      alpha *= 0.78 + Math.random() * 0.22;
      alpha *= beamProgress;
      strokeBoltThin(b.bolt, b.width, alpha, tail, head);
    }

    // === AFTERGLOWS (ghost trails after bolts die) ===
    for (let i = afterglows.length - 1; i >= 0; i--) {
      const ag = afterglows[i];
      ag.age += 0.032;
      if (ag.age >= ag.life) { afterglows.splice(i, 1); continue; }
      const alpha = ag.initialAlpha * (1 - ag.age / ag.life) * beamProgress;
      strokeAfterglow(ag.bolt, alpha);
    }

    // === ENDPOINT FLASHES (bright dots at bolt endpoints) ===
    for (let i = endpointFlashes.length - 1; i >= 0; i--) {
      const fl = endpointFlashes[i];
      fl.age += 0.032;
      if (fl.age >= fl.life) { endpointFlashes.splice(i, 1); continue; }
      const lifeFrac = fl.age / fl.life;
      const alpha = (1 - lifeFrac) * beamProgress;
      const size = fl.size * (1 - lifeFrac * 0.3);
      const px = centerX + fl.x;
      const py = centerY + fl.y;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, size * 2);
      grad.addColorStop(0, `rgba(240, 250, 255, ${alpha})`);
      grad.addColorStop(0.35, `rgba(140, 200, 255, ${alpha * 0.6})`);
      grad.addColorStop(1, 'rgba(60, 150, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(px - size * 2, py - size * 2, size * 4, size * 4);
    }

    ctx.shadowBlur = 0;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';

    ctx.restore();
  }
  drawPlasma();

  // --- Handle resize ---
  window.addEventListener('resize', () => {
    if (riveInstance) riveInstance.resizeDrawingSurfaceToCanvas();
  });

})();
</script>

</body>
</html>
