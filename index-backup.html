<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Touch to Create</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Avenir Next Cyr';
    src: url('assets/AvenirNextCyr-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Avenir Next Cyr';
    src: url('assets/AvenirNextCyr-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: 'Didot';
    src: url('assets/Didot.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Didot';
    src: url('assets/Didot-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Didot';
    src: url('assets/Didot-Italic.ttf') format('truetype');
    font-weight: 400;
    font-style: italic;
  }
</style>
<script src="https://unpkg.com/@rive-app/canvas@2.23.10"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #frame {
    width: 1080px;
    height: 1920px;
    transform-origin: center center;
    position: relative;
    overflow: hidden;
    background: #b8cfe0;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }

  /* ============ LOGO ============ */

  .logo {
    position: absolute;
    top: 40px;
    left: 40px;
    width: 180px;
    height: auto;
    z-index: 12;
    pointer-events: none;
  }

  /* ============ SKY LAYERS ============ */

  .sky-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #7baed4 0%, #a0c8e0 15%, #c4dced 35%,
      #e2d6c8 55%, #e8c9a8 75%, #d4a878 100%
    );
    transition: opacity 2s ease-in-out;
    z-index: 0;
  }

  .sky-gradient-storm {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #1a2030 0%, #2a3348 15%, #3a4058 35%,
      #4a465a 55%, #5a4a48 75%, #3a2a20 100%
    );
    opacity: 0;
    transition: opacity 2s ease-in-out;
    z-index: 0;
  }

  .cloud-base {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    z-index: 1;
    opacity: 0.85;
    animation: drift-base 80s linear infinite;
    transition: filter 2s ease-in-out;
  }

  .cloud-base img {
    height: 100%;
    width: auto;
    display: block;
    flex-shrink: 0;
    margin-right: -700px;
  }

  @keyframes drift-base {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }

  .cloud {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    transition: filter 2s ease-in-out;
  }

  .cloud img {
    display: block;
    max-width: none;
    height: auto;
  }

  .cloud-1 { top: 3%; left: 0; opacity: 0.6; }
  .cloud-1 img { width: 1200px; animation: drift-cloud-1 30s linear infinite; animation-delay: -5s; }

  .cloud-2 { top: 32%; left: 0; opacity: 0.5; }
  .cloud-2 img { width: 1400px; animation: drift-cloud-2 70s linear infinite; animation-delay: -45s; }

  .cloud-3 { top: 58%; left: 0; opacity: 0.55; }
  .cloud-3 img { width: 1300px; animation: drift-cloud-3 50s linear infinite; animation-delay: -25s; }

  @keyframes drift-cloud-1 { 0% { transform: translateX(-1300px); } 100% { transform: translateX(1200px); } }
  @keyframes drift-cloud-2 { 0% { transform: translateX(-1500px); } 100% { transform: translateX(1200px); } }
  @keyframes drift-cloud-3 { 0% { transform: translateX(-1400px); } 100% { transform: translateX(1200px); } }

  #frame.active .sky-gradient { opacity: 0; }
  #frame.active .sky-gradient-storm { opacity: 1; }
  #frame.active .cloud-base,
  #frame.active .cloud { filter: brightness(0.35) contrast(1.5) saturate(0.5); }

  /* ============ HAND ============ */

  #hand-canvas {
    position: absolute;
    top: -235px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 1500px;
    z-index: 3;
    pointer-events: none;
    transition: filter 2s ease-in-out;
  }

  #frame.active #hand-canvas {
    animation: tremble 0.12s ease-in-out infinite alternate;
  }

  @keyframes tremble {
    from { transform: translateX(-50%) translate(0, 0); }
    to { transform: translateX(-50%) translate(1px, 1.5px); }
  }

  /* ============ CIRCLE ============ */

  .circle-area {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  .circle-btn {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.7);
    background: transparent;
    cursor: pointer;
    position: relative;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-btn.active {
    border-color: rgba(150, 200, 255, 0.9);
    box-shadow: 0 0 40px rgba(150, 200, 255, 0.4);
  }

  /* Tap hand icon inside button */
  .tap-icon {
    width: 96px;
    height: 96px;
    opacity: 0.7;
    animation: tap-motion 2s ease-in-out infinite;
  }

  .circle-btn.active .tap-icon {
    display: none;
  }

  @keyframes tap-motion {
    0% { transform: translate(85px, 85px) scale(1); opacity: 0; }
    30% { transform: translate(35px, 35px) scale(0.97); opacity: 0.7; }
    45% { transform: translate(28px, 28px) scale(0.9); opacity: 1; }
    55% { transform: translate(28px, 28px) scale(0.9); opacity: 1; }
    70% { transform: translate(35px, 35px) scale(0.97); opacity: 0.7; }
    100% { transform: translate(85px, 85px) scale(1); opacity: 0; }
  }

  /* Tap rays — appear at moment of "press" */
  .tap-rays {
    position: absolute;
    width: 60px;
    height: 60px;
    pointer-events: none;
    animation: rays-burst 2s ease-in-out infinite;
  }

  .tap-rays line {
    stroke: rgba(255, 255, 255, 0.6);
    stroke-width: 1.5;
    stroke-linecap: round;
  }

  @keyframes rays-burst {
    0% { opacity: 0; transform: scale(0.5); }
    40% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1); }
    65% { opacity: 0; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  .circle-btn.active .tap-rays {
    display: none;
  }

  /* Pulse rings */
  .circle-btn::before,
  .circle-btn::after {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: pulse 2.5s ease-out infinite;
  }
  .circle-btn::after { animation-delay: 1.25s; }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }

  .circle-btn.active::before,
  .circle-btn.active::after { animation-play-state: paused; opacity: 0; }

  /* Touch text */
  .touch-text {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-size: 38px;
    white-space: nowrap;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 5px;
    user-select: none;
    -webkit-user-select: none;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
    text-transform: uppercase;
  }

  /* ============ LANGUAGE SWITCHER ============ */

  .lang-btn {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.6);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.3s;
    margin-top: 5px;
  }

  .lang-btn:hover {
    border-color: rgba(255, 255, 255, 0.7);
    color: rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.15);
  }

  /* ============ BOTTOM SECTION ============ */

  .bottom-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 900px;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    z-index: 4;
    pointer-events: none;
  }

  .bottom-section {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 0 65px 50px;
    user-select: none;
    -webkit-user-select: none;
  }

  .title-main {
    font-family: 'Didot', 'Georgia', serif;
    font-size: 143px;
    font-weight: 700;
    color: #fff;
    line-height: 1.0;
    margin-bottom: 5px;
    letter-spacing: 3px;
    text-align: center;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.3s, text-shadow 0.3s;
  }

  .title-sub {
    font-family: 'Didot', 'Georgia', serif;
    font-size: 86px;
    font-weight: 400;
    font-style: normal;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.2;
    margin-bottom: 200px;
    text-align: center;
    letter-spacing: 2px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.3s, text-shadow 0.3s;
  }

  .title-main.scrambling,
  .title-sub.scrambling {
    filter: blur(8px);
    text-shadow: 0 0 30px rgba(150, 180, 255, 0.6), 0 0 60px rgba(120, 150, 255, 0.4);
  }

  .title-main,
  .title-sub {
    transition: filter 0.5s ease-in-out, text-shadow 0.5s ease-in-out;
  }

  /* Glitch effect */
  @keyframes glitch-1 {
    0% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 2px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translate(3px, -1px); }
    40% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 1px); }
    60% { clip-path: inset(10% 0 70% 0); transform: translate(4px, -2px); }
    80% { clip-path: inset(70% 0 5% 0); transform: translate(-1px, 3px); }
    100% { clip-path: inset(30% 0 40% 0); transform: translate(2px, -1px); }
  }

  @keyframes glitch-2 {
    0% { clip-path: inset(50% 0 20% 0); transform: translate(3px, -2px); opacity: 0.8; }
    25% { clip-path: inset(10% 0 60% 0); transform: translate(-4px, 1px); opacity: 0.6; }
    50% { clip-path: inset(70% 0 5% 0); transform: translate(2px, 3px); opacity: 0.9; }
    75% { clip-path: inset(25% 0 45% 0); transform: translate(-3px, -1px); opacity: 0.7; }
    100% { clip-path: inset(55% 0 15% 0); transform: translate(1px, 2px); opacity: 0.8; }
  }

  .title-glitch {
    position: relative;
  }

  .title-glitch.glitching::before,
  .title-glitch.glitching::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    text-align: inherit;
    letter-spacing: inherit;
    font: inherit;
    color: inherit;
  }

  .title-glitch.glitching::before {
    color: rgba(255, 100, 100, 0.8);
    animation: glitch-1 0.15s linear infinite;
  }

  .title-glitch.glitching::after {
    color: rgba(100, 200, 255, 0.8);
    animation: glitch-2 0.12s linear infinite;
  }

  .scramble-char {
    opacity: 0.5;
    color: rgba(200, 210, 255, 0.7);
  }

  .qr-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .qr-label {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    letter-spacing: 10px;
    text-indent: 10px;
  }

  .qr-code {
    width: 160px;
    height: 160px;
    border-radius: 8px;
  }

  /* ============ INFO BUTTON ============ */

  .info-btn {
    position: absolute;
    bottom: 50px;
    right: 65px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.7);
    font-family: 'Didot', 'Georgia', serif;
    font-size: 28px;
    font-style: italic;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .info-btn:hover {
    border-color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  /* ============ INFO PANEL ============ */

  .info-panel {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    padding: 140px 80px 80px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-in-out;
    overflow: hidden;
  }

  .info-bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(15px) brightness(0.4);
    z-index: -1;
    transform: scale(1.1);
  }

  .info-panel.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .info-panel-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
  }

  .info-title {
    font-family: 'Didot', 'Georgia', serif;
    font-size: 72px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }

  .info-text {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 30px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
  }

  .info-text strong {
    color: #fff;
    font-weight: 500;
  }

  .info-text .highlight {
    font-size: 34px;
    color: #fff;
    font-weight: 400;
    letter-spacing: 1px;
  }

  .info-details {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 26px;
    color: rgba(255, 255, 255, 0.6);
    line-height: 1.8;
  }

  .info-hashtags {
    font-family: 'Avenir Next Cyr', 'Inter', sans-serif;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.35);
    line-height: 1.6;
    margin-top: 10px;
  }

  .info-close {
    position: absolute;
    top: 40px;
    right: 65px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.7);
    font-size: 24px;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .info-close:hover {
    border-color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  /* Hand hides when info is open */
  #hand-canvas {
    transition: transform 1s ease-in-out;
  }

  #frame.info-open #hand-canvas {
    transform: translateX(-50%) translateY(-400px);
  }

  #frame.info-open .circle-area,
  #frame.info-open .touch-text,
  #frame.info-open .lang-btn,
  #frame.info-open .bottom-section,
  #frame.info-open .bottom-gradient {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease-in-out;
  }

  /* ============ PARTICLES ============ */

  #particle-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 3;
    pointer-events: none;
  }

  /* ============ BEAM ============ */

  #beam-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 5;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Logo -->
  <img class="logo" src="assets/logo.png" alt="Digital Art House">

  <!-- Sky -->
  <div class="sky-gradient"></div>
  <div class="sky-gradient-storm"></div>

  <!-- Main cloud background -->
  <div class="cloud-base">
    <img src="assets/clouds_0.png" alt="">
    <img src="assets/clouds_0.png" alt="">
  </div>

  <!-- Individual cloud overlays -->
  <div class="cloud cloud-1"><img src="assets/Cloud-05.png" alt=""></div>
  <div class="cloud cloud-2"><img src="assets/Cloud-17.png" alt=""></div>
  <div class="cloud cloud-3"><img src="assets/Cloud-25.png" alt=""></div>

  <!-- Hand -->
  <canvas id="hand-canvas" width="900" height="1500"></canvas>

  <!-- Bottom gradient -->
  <div class="bottom-gradient"></div>

  <!-- Circle + Touch to Create + Language switcher -->
  <div class="circle-area">
    <button class="circle-btn" id="circleBtn">
      <!-- Tap hand icon -->
      <img class="tap-icon" src="assets/touch-finger.png" alt="">
      <!-- Tap rays -->
      <svg class="tap-rays" viewBox="0 0 60 60">
        <line x1="30" y1="5" x2="30" y2="15"/>
        <line x1="50" y1="12" x2="43" y2="20"/>
        <line x1="55" y1="30" x2="45" y2="30"/>
        <line x1="10" y1="12" x2="17" y2="20"/>
        <line x1="5" y1="30" x2="15" y2="30"/>
      </svg>
    </button>
  </div>

  <!-- Touch text + language (independent from circle) -->
  <span class="touch-text" id="touchText">Touch to Create</span>
  <button class="lang-btn" id="langBtn">LV</button>

  <!-- Bottom section -->
  <div class="bottom-section">
    <div class="title-main title-glitch" id="titleMain" data-text="Michelangelo">Michelangelo</div>
    <div class="title-sub title-glitch" id="titleSub" data-text="— El tocco dell'Eterno">— El tocco dell'Eterno</div>
    <div class="qr-area">
      <span class="qr-label" id="ticketsLabel">Tickets</span>
      <img class="qr-code" src="assets/qr-code.png" alt="QR">
    </div>
  </div>

  <!-- Info button -->
  <button class="info-btn" id="infoBtn">i</button>

  <!-- Info panel -->
  <div class="info-panel" id="infoPanel">
    <video class="info-bg-video" id="infoBgVideo" loop muted playsinline>
      <source src="assets/info-bg-video.mp4" type="video/mp4">
    </video>
    <button class="info-close" id="infoClose">✕</button>
    <div class="info-panel-content" id="infoPanelContent">
      <!-- Content injected by JS based on language -->
    </div>
  </div>

  <!-- Particles -->
  <canvas id="particle-canvas" width="1080" height="1920"></canvas>

  <!-- Energy beam -->
  <canvas id="beam-canvas" width="1080" height="1920"></canvas>
</div>

<script>
(function () {
  const DESIGN_W = 1080;
  const DESIGN_H = 1920;
  const frame = document.getElementById('frame');

  // --- Scale frame to fit viewport ---
  function fitFrame() {
    const isMobile = window.innerWidth < 800;
    if (isMobile) {
      const s = window.innerHeight / DESIGN_H;
      frame.style.transform = `translate(-50%, -50%) scale(${s})`;
      frame.style.position = 'absolute';
      frame.style.top = '50%';
      frame.style.left = '50%';
      frame.style.boxShadow = 'none';
    } else {
      const pad = 40;
      const sx = (window.innerWidth - pad) / DESIGN_W;
      const sy = (window.innerHeight - pad) / DESIGN_H;
      frame.style.transform = `scale(${Math.min(sx, sy, 1)})`;
      frame.style.boxShadow = '0 0 60px rgba(0,0,0,0.5)';
    }
  }
  fitFrame();
  window.addEventListener('resize', fitFrame);

  // --- Language switcher ---
  const langBtn = document.getElementById('langBtn');
  const touchText = document.getElementById('touchText');
  const ticketsLabel = document.getElementById('ticketsLabel');
  let lang = 'en';

  langBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); });
  langBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); });
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const fxTouch = new TextScramble(touchText);
    const fxTickets = new TextScramble(ticketsLabel);
    if (lang === 'en') {
      lang = 'lv';
      langBtn.textContent = 'EN';
      fxTouch.setText('Pieskaries, lai izveidotu');
      fxTickets.setText('Biļetes');
    } else {
      lang = 'en';
      langBtn.textContent = 'LV';
      fxTouch.setText('Touch to Create');
      fxTickets.setText('Tickets');
    }
  });

  // --- Info panel ---
  const infoBtn = document.getElementById('infoBtn');
  const infoPanel = document.getElementById('infoPanel');
  const infoClose = document.getElementById('infoClose');
  const infoPanelContent = document.getElementById('infoPanelContent');

  const infoTexts = {
    en: `
      <div class="info-title">Michelangelo</div>
      <p class="info-text">A new large-scale 360° immersive exhibition at Digital Art House.</p>
      <p class="info-text">Discover the genius of the High Renaissance — <strong>Michelangelo Buonarroti</strong>.</p>
      <p class="info-text">Begin with a short introductory film.<br>Then — 50 minutes of full immersion.</p>
      <p class="info-text highlight">Light. Scale. Movement. Sound.</p>
      <p class="info-text">This is not a museum visit.<br>It is a true touch of Eternity.</p>
      <p class="info-details">📍 Digital Art House, Skolas 2<br>🎟 Tickets: digitalarthouse.eu</p>
      <p class="info-hashtags">#DigitalArtHouse #Michelangelo #ImmersiveArt #RigaEvents #ArtExperience</p>
    `,
    lv: `
      <div class="info-title">Michelangelo</div>
      <p class="info-text">Jauna, vērienīga 360° imersīvā izstāde „Digital Art House".</p>
      <p class="info-text">Atklājiet augstās renesanses ģēniju — <strong>Mičelanjelo Buonarroti</strong>.</p>
      <p class="info-text">Sāciet ar īsu ievada filmu.<br>Pēc tam — 50 minūtes pilnīgas imersijas.</p>
      <p class="info-text highlight">Gaisma. Mērogs. Kustība. Skaņa.</p>
      <p class="info-text">Šī nav parasta muzeja apmeklējuma pieredze.<br>Tā ir patiesa saskare ar mūžību.</p>
      <p class="info-details">📍 Digital Art House, Skolas 2<br>🎟 Biļetes: digitalarthouse.eu</p>
      <p class="info-hashtags">#DigitalArtHouse #Michelangelo #ImmersiveArt #RigaEvents #ArtExperience</p>
    `
  };

  const infoBgVideo = document.getElementById('infoBgVideo');

  function openInfo() {
    infoPanelContent.innerHTML = infoTexts[lang];
    frame.classList.add('info-open');
    infoPanel.classList.add('visible');
    infoBgVideo.currentTime = 0;
    infoBgVideo.play();
  }

  function closeInfo() {
    infoPanel.classList.remove('visible');
    infoBgVideo.pause();
    setTimeout(() => frame.classList.remove('info-open'), 300);
  }

  infoBtn.addEventListener('click', (e) => { e.stopPropagation(); openInfo(); });
  infoBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); });
  infoBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); });
  infoClose.addEventListener('click', closeInfo);
  infoPanel.addEventListener('click', closeInfo);

  // --- Rive setup ---
  const handCanvas = document.getElementById('hand-canvas');
  let riveInstance = null;
  let isPressedInput = null;

  const r = new rive.Rive({
    src: 'assets/hand.riv',
    canvas: handCanvas,
    autoplay: true,
    stateMachines: 'State Machine 1',
    fit: rive.Fit.Contain,
    alignment: rive.Alignment.Center,
    onLoad: () => {
      riveInstance = r;
      const inputs = r.stateMachineInputs('State Machine 1');
      if (inputs) {
        isPressedInput = inputs.find(i => i.name === 'isPressed');
        console.log('Rive loaded. Inputs:', inputs.map(i => i.name));
      }
      r.resizeDrawingSurfaceToCanvas();
    },
    onLoadError: (e) => {
      console.error('Rive load error:', e);
    }
  });

  // --- Circle interaction ---
  const btn = document.getElementById('circleBtn');

  const titleMain = document.getElementById('titleMain');
  const titleSub = document.getElementById('titleSub');

  // --- Text Scramble (airport flip board effect) ---
  class TextScramble {
    constructor(el) {
      this.el = el;
      this.chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      this.update = this.update.bind(this);
    }
    setText(newText) {
      const oldText = this.el.innerText;
      const length = Math.max(oldText.length, newText.length);
      const promise = new Promise((resolve) => (this.resolve = resolve));
      this.queue = [];
      for (let i = 0; i < length; i++) {
        const from = oldText[i] || '';
        const to = newText[i] || '';
        const start = Math.floor(Math.random() * 20);
        const end = start + Math.floor(Math.random() * 25);
        this.queue.push({ from, to, start, end });
      }
      cancelAnimationFrame(this.frameRequest);
      this.frame = 0;
      this.update();
      return promise;
    }
    update() {
      let output = '';
      let complete = 0;
      for (let i = 0, n = this.queue.length; i < n; i++) {
        let { from, to, start, end, char } = this.queue[i];
        if (this.frame >= end) {
          complete++;
          output += to;
        } else if (this.frame >= start) {
          if (!char || Math.random() < 0.28) {
            char = this.chars[Math.floor(Math.random() * this.chars.length)];
            this.queue[i].char = char;
          }
          output += `<span class="scramble-char">${char}</span>`;
        } else {
          output += from;
        }
      }
      this.el.innerHTML = output;
      if (complete === this.queue.length) {
        this.resolve();
        return;
      }
      this.frameRequest = requestAnimationFrame(this.update);
      this.frame++;
    }
  }

  const fxMain = new TextScramble(titleMain);
  const fxSub = new TextScramble(titleSub);

  function activate() {
    wasActive = true;
    btn.classList.add('active');
    frame.classList.add('active');
    isActive = true;
    if (isPressedInput) isPressedInput.value = true;
    titleMain.classList.add('scrambling');
    titleSub.classList.add('scrambling');
    fxMain.setText(lang === 'lv' ? 'IESPAIDĪGA' : 'IMMERSIVE').then(() => titleMain.classList.remove('scrambling'));
    fxSub.setText(lang === 'lv' ? 'IZSTĀDE' : 'EXHIBITION').then(() => titleSub.classList.remove('scrambling'));
  }

  let wasActive = false;

  function deactivate() {
    if (!wasActive) return;
    wasActive = false;
    btn.classList.remove('active');
    frame.classList.remove('active');
    isActive = false;
    if (isPressedInput) isPressedInput.value = false;
    titleMain.classList.add('scrambling');
    titleSub.classList.add('scrambling');
    fxMain.setText('Michelangelo').then(() => titleMain.classList.remove('scrambling'));
    fxSub.setText('— El tocco dell\'Eterno').then(() => titleSub.classList.remove('scrambling'));
  }

  btn.addEventListener('mousedown', activate);
  window.addEventListener('mouseup', deactivate);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); activate(); });
  window.addEventListener('touchend', deactivate);

  // --- Particles ---
  const particleCanvas = document.getElementById('particle-canvas');
  const pCtx = particleCanvas.getContext('2d');
  const particles = [];
  const PARTICLE_COUNT = 60;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * 1080, y: Math.random() * 1920,
      size: Math.random() * 2 + 0.5,
      speedX: Math.random() * 0.8 + 0.2,
      speedY: (Math.random() - 0.5) * 0.3,
      opacity: Math.random() * 0.4 + 0.1,
      wobbleSpeed: Math.random() * 2 + 1,
      wobbleAmp: Math.random() * 0.5 + 0.2,
    });
  }

  function drawParticles() {
    requestAnimationFrame(drawParticles);
    pCtx.clearRect(0, 0, 1080, 1920);
    for (const p of particles) {
      p.x += p.speedX;
      p.y += p.speedY + Math.sin(p.x * 0.01 * p.wobbleSpeed) * p.wobbleAmp;
      if (p.x > 1100) { p.x = -20; p.y = Math.random() * 1920; }
      if (p.y < -20) p.y = 1940;
      if (p.y > 1940) p.y = -20;
      pCtx.globalAlpha = p.opacity;
      pCtx.fillStyle = 'rgba(255, 255, 255, 1)';
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      pCtx.fill();
    }
    pCtx.globalAlpha = 1;
  }
  drawParticles();

  // --- Plasma Energy Effect ---
  const beamCanvas = document.getElementById('beam-canvas');
  const ctx = beamCanvas.getContext('2d');
  let isActive = false;
  let beamProgress = 0;
  let time = 0;

  const centerX = 540;
  const centerY = 806;
  const TENDRIL_COUNT = 12;
  const TENDRIL_LENGTH = 120;

  const tendrils = [];
  for (let i = 0; i < TENDRIL_COUNT; i++) {
    tendrils.push({
      angle: (i / TENDRIL_COUNT) * Math.PI * 2,
      phase: Math.random() * Math.PI * 2,
      speed: 3 + Math.random() * 5,
      length: TENDRIL_LENGTH + Math.random() * 60,
      width: 1 + Math.random() * 2,
      opacity: 0.15 + Math.random() * 0.25,
      wobble: 15 + Math.random() * 25,
      segments: 12 + Math.floor(Math.random() * 8),
    });
  }

  const sparkParticles = [];
  for (let i = 0; i < 25; i++) {
    sparkParticles.push({
      angle: Math.random() * Math.PI * 2,
      dist: Math.random(),
      speed: 0.008 + Math.random() * 0.02,
      size: 1 + Math.random() * 2.5,
      opacity: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      maxDist: 80 + Math.random() * 80,
    });
  }

  function drawPlasma() {
    requestAnimationFrame(drawPlasma);
    time += 0.032;

    const target = isActive ? 1 : 0;
    beamProgress += (target - beamProgress) * (isActive ? 5 : 3) * 0.016;
    if (Math.abs(beamProgress - target) < 0.001) beamProgress = target;

    ctx.clearRect(0, 0, 1080, 1920);
    if (beamProgress < 0.02) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // === RADIAL TENDRILS ===
    for (const t of tendrils) {
      const angleWobble = Math.sin(time * t.speed * 0.5 + t.phase) * 0.3;
      const currentAngle = t.angle + angleWobble;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);

      for (let s = 1; s <= t.segments; s++) {
        const frac = s / t.segments;
        const dist = t.length * frac * beamProgress;
        const perpWobble = Math.sin(time * t.speed + frac * 6 + t.phase) * t.wobble * frac * (1 - frac * 0.5);

        const dx = Math.cos(currentAngle) * dist - Math.sin(currentAngle) * perpWobble * beamProgress;
        const dy = Math.sin(currentAngle) * dist + Math.cos(currentAngle) * perpWobble * beamProgress;

        ctx.lineTo(centerX + dx, centerY + dy);
      }

      const r = Math.round(130 + Math.sin(time + t.phase) * 30);
      const g = Math.round(160 + Math.sin(time * 0.7 + t.phase) * 40);
      const b = Math.round(240 + Math.sin(time * 1.3 + t.phase) * 15);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${t.opacity * beamProgress})`;
      ctx.lineWidth = t.width * beamProgress;
      ctx.shadowColor = `rgba(${r}, ${g}, 255, 0.5)`;
      ctx.shadowBlur = 10 * beamProgress;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // === SPARK PARTICLES ===
    for (const sp of sparkParticles) {
      sp.dist += sp.speed;
      if (sp.dist > 1) {
        sp.dist = 0;
        sp.angle = Math.random() * Math.PI * 2;
      }

      const d = sp.dist * sp.maxDist * beamProgress;
      const wobbleAngle = sp.angle + Math.sin(time * 2 + sp.phase) * 0.3;
      const px = centerX + Math.cos(wobbleAngle) * d;
      const py = centerY + Math.sin(wobbleAngle) * d;
      const pSize = sp.size * beamProgress * (1 - sp.dist * 0.5);

      const pGrad = ctx.createRadialGradient(px, py, 0, px, py, pSize * 3);
      pGrad.addColorStop(0, `rgba(200, 220, 255, ${sp.opacity * beamProgress * (1 - sp.dist)})`);
      pGrad.addColorStop(1, 'rgba(150, 170, 255, 0)');
      ctx.fillStyle = pGrad;
      ctx.fillRect(px - pSize * 3, py - pSize * 3, pSize * 6, pSize * 6);
    }

    // === CENTER GLOW ===
    const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 70 * beamProgress);
    glow.addColorStop(0, `rgba(200, 220, 255, ${0.7 * beamProgress})`);
    glow.addColorStop(0.3, `rgba(150, 170, 255, ${0.25 * beamProgress})`);
    glow.addColorStop(1, 'rgba(120, 140, 255, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(centerX - 80, centerY - 80, 160, 160);

    ctx.restore();
  }
  drawPlasma();

  // --- Handle resize ---
  window.addEventListener('resize', () => {
    if (riveInstance) riveInstance.resizeDrawingSurfaceToCanvas();
  });

})();
</script>
